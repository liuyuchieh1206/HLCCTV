<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>花蓮水利科 CCTV 監控與水情歷史</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="水利CCTV">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f172a;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      background: #1e293b;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 2000;
    }
    header h1 { font-size: 1rem; margin-bottom: 2px; }
    
    #container { display: flex; flex: 1; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; width: 100%; }
    
    #cctv-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80%; /* 稍微加高一點讓資訊好滑動 */
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      border-top: 2px solid #3b82f6;
      z-index: 1000;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.6);
      transition: transform 0.3s ease;
    }
    #cctv-panel.hidden { transform: translateY(100%); }
    
    .panel-header {
      padding: 8px 14px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn { background: #334155; border: none; color: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    
    /* 影片區塊固定比例，不會被擠壓 */
    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }
    #cctv-img { width: 100%; height: 100%; object-fit: contain; }

    /* 下方資訊區塊改為獨立可滑動 */
    .scrollable-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .controls {
      background: #1e293b;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid #334155;
    }
    .timeline-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }
    #play-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    #play-btn.playing { background: #f59e0b; }
    input[type=range] { flex: 1; accent-color: #3b82f6; cursor: pointer; }

    .info-card {
      background: #0f172a;
      padding: 8px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      font-size: 0.75rem;
    }
    .info-item {
      background: #1e293b;
      padding: 6px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
    }
    .info-item .label { color: #94a3b8; font-size: 0.7rem; margin-bottom: 2px; text-align: center;}
    .info-item .value { font-weight: bold; color: #38bdf8; }

    .rain-chart-container { background: #0f172a; padding: 0 14px 12px 14px; }
    .rain-chart-title {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .rain-bars {
      display: flex;
      align-items: flex-end;
      height: 45px;
      gap: 2px;
      background: #1e293b;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .rain-bar {
      flex: 1;
      background: #334155;
      border-radius: 2px 2px 0 0;
      min-height: 1px;
    }

    /* ====== 全新：13 鄉鎮全覽網格 ====== */
    .county-rain-container {
      background: #0f172a;
      padding: 12px 14px 24px 14px;
      border-top: 1px solid #1e293b;
    }
    .county-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 一排顯示 4 個，乾淨俐落 */
      gap: 6px;
      margin-top: 8px;
    }
    .county-item {
      background: #1e293b;
      padding: 8px 4px;
      border-radius: 6px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .county-item .ts-name { color: #cbd5e1; font-size: 0.75rem; margin-bottom: 3px;}
    .county-item .ts-rain { font-weight: bold; font-size: 0.85rem; color: #4ade80;}
    /* 雨量警示色 */
    .county-item.warning .ts-rain { color: #f59e0b; }
    .county-item.danger .ts-rain { color: #ef4444; }
    .county-item.offline .ts-rain { color: #64748b; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>花蓮水利科 監控地圖</h1>
      <div id="sys-clock" style="font-size: 0.75rem; color: #94a3b8;">載入時間中...</div>
    </div>
    <span style="font-size: 0.75rem; color: #38bdf8;">CWA 氣象署即時連線</span>
  </header>

  <div id="container">
    <div id="map"></div>

    <div id="cctv-panel" class="hidden">
      <div class="panel-header">
        <div>
          <span id="cam-name" style="font-weight: bold; font-size: 0.95rem;">監視器</span>
          <span id="cam-coord" style="font-size: 0.75rem; color: #94a3b8; margin-left: 8px;"></span>
        </div>
        <button class="close-btn" onclick="closeCam()">關閉 ✕</button>
      </div>
      
      <div class="video-container">
        <img id="cctv-img" src="" alt="畫面載入中..." />
      </div>

      <!-- 下方所有資訊包在 scrollable-content 裡面，允許獨立上下滑動 -->
      <div class="scrollable-content">
        <div class="controls">
          <div class="timeline-info">
            <span id="time-display">畫面載入中...</span>
            <span id="mode-badge" style="color: #4ade80;">● 最新紀錄</span>
          </div>
          <div class="slider-row">
            <button id="play-btn" onclick="togglePlay()">▶ 播放</button>
            <input type="range" id="time-slider" min="0" max="0" value="0" oninput="onSliderChange(this.value)">
          </div>
        </div>

        <div class="info-card">
          <div class="info-item">
            <span class="label">當地氣溫</span>
            <span class="value" id="val-temp">-- °C</span>
          </div>
          <div class="info-item">
            <span class="label">當前時雨量</span>
            <span class="value" id="val-rain" style="color: #4ade80;">-- mm</span>
          </div>
          <div class="info-item">
            <span class="label">相對濕度</span>
            <span class="value" id="val-humidity">-- %</span>
          </div>
          <div class="info-item">
            <span class="label">平均風速</span>
            <span class="value" id="val-wind">-- m/s</span>
          </div>
        </div>

        <div class="rain-chart-container">
          <div class="rain-chart-title">
            <span>過去 24 小時降雨趨勢 (推算)</span>
            <span id="val-24h-sum" style="color: #4ade80; font-weight: bold;">累積 0.0 mm</span>
          </div>
          <div class="rain-bars" id="rain-chart"></div>
        </div>

        <!-- 全新的 13 鄉鎮全覽面板 -->
        <div class="county-rain-container">
          <div class="rain-chart-title">
            <span style="color:#fff; font-weight:bold;">花蓮縣 13 鄉鎮市 本日累積雨量</span>
            <button onclick="fetchCountyRainfall()" style="background:none;border:none;color:#3b82f6;cursor:pointer;font-size:0.75rem;">↻ 重新整理</button>
          </div>
          <div class="county-grid" id="county-rain-grid">
            <div style="color:#94a3b8; font-size: 0.75rem; grid-column: span 4; text-align:center; padding: 10px;">資料向氣象署拉取中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CWA_API_KEY = "CWA-BF25F9D4-B21F-43D8-8260-8F026866C42E";

    // 花蓮 13 鄉鎮測站對照表 (照順序排列)
    const stationsMap = {
      "C0TA40": "秀林鄉", "C0Z180": "新城鄉", "466990": "花蓮市",
      "C2TB30": "吉安鄉", "C1Z120": "壽豐鄉", "C0Z160": "鳳林鎮",
      "C0Z200": "萬榮鄉", "C0T960": "光復鄉", "C0Z210": "瑞穗鄉",
      "C0Z170": "卓溪鄉", "C0Z061": "玉里鎮", "C0T9N0": "富里鄉",
      "C0T9I0": "豐濱鄉"
    };

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleString('zh-TW', { hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('sys-clock').innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const cctvList = [
      { id: "wra-000901", name: "沼田橋 1", lat: 23.8717, lng: 121.5119, station: "C1Z120" },
      { id: "wra-000779", name: "農墾橋 1", lat: 23.8698, lng: 121.5131, station: "C1Z120" }
    ];

    let historyData = {};
    let currentCam = null;
    let currentCamFiles = [];
    let autoPlayTimer = null;
    let isPlaying = false;
    
    const slider = document.getElementById('time-slider');
    const imgEl = document.getElementById('cctv-img');
    const playBtn = document.getElementById('play-btn');

    function fetchHistoryData() {
      return fetch(`history/index.json?t=${Date.now()}`)
        .then(res => res.json())
        .then(data => { historyData = data; })
        .catch(() => console.log('尚未產生歷史資料'));
    }
    fetchHistoryData();

    const map = L.map('map').setView([23.8708, 121.5125], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const camIcon = L.divIcon({
      html: `<div style="background:#2563eb;color:white;padding:5px;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:14px;">📹</div>`,
      className: 'custom-cam-icon', iconSize: [28, 28], iconAnchor: [14, 14]
    });

    cctvList.forEach(cam => {
      const marker = L.marker([cam.lat, cam.lng], { icon: camIcon }).addTo(map);
      marker.bindTooltip(`<b>${cam.name}</b>`);
      marker.on('click', () => {
        fetchHistoryData().then(() => openCam(cam));
      });
    });

    function openCam(cam) {
      pauseAutoPlay();
      currentCam = cam;
      document.getElementById('cam-name').innerText = cam.name;
      document.getElementById('cam-coord').innerText = `(${cam.lat}, ${cam.lng})`;
      document.getElementById('cctv-panel').classList.remove('hidden');

      // 呼叫天氣與雨量更新
      fetchLocalWeather(cam.station);
      fetchChartData(cam.lat, cam.lng);
      fetchCountyRainfall(); // 每次打開面板順便更新 13 鄉鎮資料

      currentCamFiles = (historyData && historyData[cam.id]) ? historyData[cam.id] : [];
      
      if (currentCamFiles.length > 0) {
        slider.max = currentCamFiles.length - 1; 
        slider.value = currentCamFiles.length - 1; 
      } else {
        slider.max = 0;
        slider.value = 0;
      }
      
      showImageAtIndex(slider.value);
      map.invalidateSize();
    }

    // ====== 擷取單一測站即時觀測資料 (上方卡片) ======
    function fetchLocalWeather(stationId) {
      const cwaUrl = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0002-001?Authorization=${CWA_API_KEY}&StationId=${stationId}`;
      fetch(cwaUrl)
        .then(res => res.json())
        .then(data => {
          if (data.records && data.records.Station && data.records.Station.length > 0) {
            const we = data.records.Station[0].WeatherElement;
            
            const temp = (we.AirTemperature !== undefined && we.AirTemperature > -90) ? we.AirTemperature : '--';
            const humidity = (we.RelativeHumidity !== undefined && we.RelativeHumidity > -90) ? we.RelativeHumidity : '--';
            const wind = (we.WindSpeed !== undefined && we.WindSpeed > -90) ? we.WindSpeed : '--';

            // 強制抓取雨量，若為異常值則顯示 0
            let rain = 0;
            if (we.Past1hr && we.Past1hr.Precipitation > -90) rain = we.Past1hr.Precipitation;
            else if (we.Now && we.Now.Precipitation > -90) rain = we.Now.Precipitation;

            document.getElementById('val-temp').innerText = `${temp} °C`;
            document.getElementById('val-humidity').innerText = `${humidity} %`;
            document.getElementById('val-wind').innerText = `${wind} m/s`;
            
            const rainEl = document.getElementById('val-rain');
            rainEl.innerText = `${rain} mm`;
            if (rain >= 40) rainEl.style.color = '#ef4444';
            else if (rain >= 15) rainEl.style.color = '#f59e0b';
            else rainEl.style.color = '#4ade80';
          }
        }).catch(() => {});
    }

    // ====== 擷取並渲染 13 鄉鎮市累積雨量 (面板最下方) ======
    function fetchCountyRainfall() {
      const endpoints = ['O-A0001-001', 'O-A0002-001', 'O-A0003-001'];
      const stationIds = Object.keys(stationsMap).join(',');
      
      // 同時向三個資料庫要資料，確保 13 個測站都抓得到
      Promise.all(endpoints.map(ep => 
        fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/${ep}?Authorization=${CWA_API_KEY}&StationId=${stationIds}`)
          .then(res => res.json())
          .catch(() => null)
      )).then(results => {
        let combinedStations = [];
        results.forEach(data => {
          if (data && data.records && data.records.Station) {
            combinedStations = combinedStations.concat(data.records.Station);
          }
        });

        const grid = document.getElementById('county-rain-grid');
        grid.innerHTML = '';
        
        // 建立預設底稿，確保 13 個一定會顯示 (滿足你的需求)
        const renderData = {};
        for (let id in stationsMap) renderData[id] = { name: stationsMap[id], rain: '--' };

        // 填入氣象署回傳的真實雨量
        combinedStations.forEach(st => {
          const id = st.StationId;
          if (renderData[id]) {
            const we = st.WeatherElement;
            let rain24 = '--';
            if (we) {
               if (we.Past24hr && we.Past24hr.Precipitation !== undefined) rain24 = we.Past24hr.Precipitation;
               else if (we.Now && we.Now.Precipitation !== undefined) rain24 = we.Now.Precipitation;
               else if (we.Precipitation !== undefined) rain24 = we.Precipitation;
            }
            
            // 只要不是極端負數(維修代碼)，就顯示出來
            if (rain24 !== '--' && parseFloat(rain24) > -90) {
               renderData[id].rain = parseFloat(rain24).toFixed(1);
            } else if (parseFloat(rain24) <= -90) {
               renderData[id].rain = '0.0'; // 如果感測器壞掉，為了不破壞排版預設顯示 0
            }
          }
        });

        // 畫出乾淨的 13 鄉鎮網格
        for (let id in stationsMap) {
          const item = renderData[id];
          let colorClass = '';
          const rainVal = parseFloat(item.rain);
          
          if (!isNaN(rainVal)) {
            if (rainVal >= 80) colorClass = 'danger';
            else if (rainVal >= 40) colorClass = 'warning';
          } else {
            colorClass = 'offline';
          }
          
          grid.innerHTML += `
            <div class="county-item ${colorClass}">
              <span class="ts-name">${item.name}</span>
              <span class="ts-rain">${isNaN(rainVal) ? '-- mm' : item.rain + ' mm'}</span>
            </div>
          `;
        }
      });
    }

    // ====== 保留 Open-Meteo 推算圖表 ======
    function fetchChartData(lat, lng) {
      const chartUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=precipitation&past_hours=24&forecast_hours=1&timezone=Asia%2FTaipei`;
      fetch(chartUrl)
        .then(res => res.json())
        .then(data => {
          const hourlyRain = data.hourly.precipitation.slice(0, 24); 
          const sum24h = hourlyRain.reduce((sum, val) => sum + val, 0).toFixed(1);
          document.getElementById('val-24h-sum').innerText = `累積 ${sum24h} mm`;

          const chart = document.getElementById('rain-chart');
          chart.innerHTML = '';
          const maxRain = Math.max(...hourlyRain, 10); 
          
          hourlyRain.forEach((val) => { 
            const heightPct = (val / maxRain) * 100;
            let bgColor = '#334155';
            if (val > 0) bgColor = '#38bdf8';
            if (val >= 10) bgColor = '#f59e0b';
            if (val >= 20) bgColor = '#ef4444';
            chart.innerHTML += `<div class="rain-bar" style="height: ${heightPct}%; background: ${bgColor};"></div>`;
          });
        }).catch(() => {});
    }

    // 滑桿與播放控制邏輯 (維持原樣)
    function onSliderChange(index) {
      if (isPlaying) pauseAutoPlay();
      showImageAtIndex(index);
    }

    function togglePlay() {
      if (!currentCamFiles || currentCamFiles.length === 0) return;
      if (isPlaying) pauseAutoPlay();
      else startAutoPlay();
    }

    function startAutoPlay() {
      isPlaying = true;
      playBtn.innerText = "⏸ 暫停";
      playBtn.classList.add('playing');
      if (parseInt(slider.value) === parseInt(slider.max)) {
        slider.value = 0;
        showImageAtIndex(0);
      }
      autoPlayTimer = setInterval(() => {
        let nextIndex = parseInt(slider.value) + 1;
        if (nextIndex > parseInt(slider.max)) pauseAutoPlay();
        else { slider.value = nextIndex; showImageAtIndex(nextIndex); }
      }, 800); 
    }

    function pauseAutoPlay() {
      isPlaying = false;
      playBtn.innerText = "▶ 播放";
      playBtn.classList.remove('playing');
      if (autoPlayTimer) { clearInterval(autoPlayTimer); autoPlayTimer = null; }
    }

    function showImageAtIndex(index) {
      if (!currentCamFiles || currentCamFiles.length === 0) {
        const cacheBuster = `t=${Date.now()}&r=${Math.random()}`;
        imgEl.src = `https://c01.twipcam.com/cam/snapshot/${currentCam.id}.jpg?${cacheBuster}`;
        document.getElementById('time-display').innerText = `目前無歷史紀錄 (顯示官方快照)`;
        return;
      }
      const fileName = currentCamFiles[index];
      imgEl.src = `history/${currentCam.id}/${fileName}`;
      const timeStr = `${fileName.slice(0,4)}/${fileName.slice(4,6)}/${fileName.slice(6,8)} ${fileName.slice(9,11)}:${fileName.slice(11,13)}`;
      document.getElementById('time-display').innerText = `記錄時間：${timeStr}`;

      if (index == slider.max) {
        document.getElementById('mode-badge').innerText = "● 最新紀錄";
        document.getElementById('mode-badge').style.color = "#4ade80";
      } else {
        document.getElementById('mode-badge').innerText = "⏱ 歷史回放";
        document.getElementById('mode-badge').style.color = "#f59e0b";
      }
    }

    function closeCam() {
      pauseAutoPlay();
      imgEl.src = ""; 
      document.getElementById('cctv-panel').classList.add('hidden');
      map.invalidateSize();
    }
  </script>
</body>
</html>
