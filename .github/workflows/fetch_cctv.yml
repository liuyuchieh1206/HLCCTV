name: Auto Backup CCTV Snapshot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Browser Automation (Playwright)
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: Capture Live Video Screenshot & Clean
        run: |
          export TZ="Asia/Taipei"
          
          python3 - <<EOF
          from playwright.sync_api import sync_playwright
          import datetime, os, time, json

          cams = ["wra-000901", "wra-000779"]
          timestamp = datetime.datetime.now().strftime("%Y%m%d_%H%M")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              # 稍微放大虛擬螢幕，確保畫質清晰
              context = browser.new_context(viewport={'width': 1920, 'height': 1080})
              page = context.new_page()
              
              for cam in cams:
                  os.makedirs(f"history/{cam}", exist_ok=True)
                  print(f"正在模擬真人觀看 {cam}...")
                  try:
                      page.goto(f"https://www.twipcam.com/cam/{cam}", timeout=60000)
                      
                      # 停頓 15 秒，讓網頁載入最新畫面
                      time.sleep(15)
                      
                      # 👑 關鍵修正：精準尋找 <video> 或 src 包含該攝影機 ID 的 <img>
                      player = page.locator(f"video, img[src*='{cam}']").first
                      
                      if player.is_visible():
                          # 只針對這個播放器元素截圖，完美去背！
                          player.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                          print(f"成功截取 {cam} 的純淨畫面！")
                      else:
                          # 真的找不到才截全圖
                          page.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                          
                  except Exception as e:
                      print(f"截圖失敗 {cam}: {e}")
                      
              browser.close()

          # 產生檔案清單索引
          data = {}
          for c in cams:
              path = f"history/{c}"
              if os.path.exists(path):
                  files = sorted([f for f in os.listdir(path) if f.endswith(".jpg")])
                  data[c] = files
          with open("history/index.json", "w") as f:
              json.dump(data, f)
          EOF

          # 清理超過 3 天 (72小時) 的舊圖
          find history/ -type f -name "*.jpg" -mtime +3 -exec rm {} \;

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git commit -m "Auto backup via Playwright [skip ci]" || exit 0
          git push
