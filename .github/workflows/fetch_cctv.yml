name: Auto Backup CCTV Snapshot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Browser Automation (Playwright)
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: Capture Live Video Screenshot & Clean
        run: |
          export TZ="Asia/Taipei"
          
          python3 - <<EOF
          from playwright.sync_api import sync_playwright
          import datetime, os, time, json

          cams = ["wra-000901", "wra-000779"]
          timestamp = datetime.datetime.now().strftime("%Y%m%d_%H%M")

          with sync_playwright() as p:
              # 👑 關鍵修正 1：加入底層參數，強制關閉 Chrome 的「禁止自動播放限制」
              browser = p.chromium.launch(
                  headless=True,
                  args=["--autoplay-policy=no-user-gesture-required"]
              )
              context = browser.new_context(viewport={'width': 1920, 'height': 1080})
              page = context.new_page()
              
              for cam in cams:
                  os.makedirs(f"history/{cam}", exist_ok=True)
                  print(f"正在模擬真人觀看 {cam}...")
                  try:
                      page.goto(f"https://www.twipcam.com/cam/{cam}", timeout=60000)
                      
                      # 先給網頁 3 秒鐘載入基本元素
                      time.sleep(3)
                      player = page.locator(f"video, img[src*='{cam}']").first
                      
                      # 👑 關鍵修正 2：雙重保險，模擬滑鼠精準點擊播放器來喚醒串流
                      if player.is_visible():
                          try:
                              player.click(timeout=5000)
                          except:
                              pass
                      
                      # 停頓 15 秒，讓即時串流影片有足夠時間緩衝並跳出最新的時間戳記
                      time.sleep(15)
                      
                      if player.is_visible():
                          player.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                          print(f"成功截取 {cam} 的最新跳動畫面！")
                      else:
                          page.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                          
                  except Exception as e:
                      print(f"截圖失敗 {cam}: {e}")
                      
              browser.close()

          # 產生檔案清單索引
          data = {}
          for c in cams:
              path = f"history/{c}"
              if os.path.exists(path):
                  files = sorted([f for f in os.listdir(path) if f.endswith(".jpg")])
                  data[c] = files
          with open("history/index.json", "w") as f:
              json.dump(data, f)
          EOF

          # 清理超過 3 天 (72小時) 的舊圖
          find history/ -type f -name "*.jpg" -mtime +3 -exec rm {} \;

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git commit -m "Auto backup via Playwright [skip ci]" || exit 0
          git push
