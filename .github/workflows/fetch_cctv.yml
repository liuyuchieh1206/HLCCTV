name: Auto Backup CCTV Snapshot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Browser Automation (Playwright)
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: Capture Live Video Screenshot & Clean
        run: |
          export TZ="Asia/Taipei"
          
          # 執行 Python 腳本模擬真人開網頁截圖
          python3 - <<EOF
          from playwright.sync_api import sync_playwright
          import datetime, os, time, json

          cams = ["wra-000901", "wra-000779"]
          timestamp = datetime.datetime.now().strftime("%Y%m%d_%H%M")

          with sync_playwright() as p:
              # 開啟隱形的 Chrome 瀏覽器
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(viewport={'width': 1280, 'height': 720})
              page = context.new_page()
              
              for cam in cams:
                  os.makedirs(f"history/{cam}", exist_ok=True)
                  print(f"正在模擬真人觀看 {cam}...")
                  try:
                      # 1. 直接前往該監視器的播放頁面
                      page.goto(f"https://www.twipcam.com/cam/{cam}", timeout=60000)
                      
                      # 2. 停頓 15 秒，讓網頁有足夠時間載入最新串流與跳動時間
                      time.sleep(15)
                      
                      # 3. 尋找畫面中的 <video> 影片播放器並針對它精準截圖
                      video = page.locator("video").first
                      if video.is_visible():
                          video.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                      else:
                          # 備用：若找不到影片標籤，直接截圖整個網頁
                          page.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                          
                  except Exception as e:
                      print(f"截圖失敗 {cam}: {e}")
                      
              browser.close()

          # 產生檔案清單索引
          data = {}
          for c in cams:
              path = f"history/{c}"
              if os.path.exists(path):
                  files = sorted([f for f in os.listdir(path) if f.endswith(".jpg")])
                  data[c] = files
          with open("history/index.json", "w") as f:
              json.dump(data, f)
          EOF

          # 清理超過 3 天的舊圖
          find history/ -type f -name "*.jpg" -mtime +3 -exec rm {} \;

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          git commit -m "Auto backup via Playwright [skip ci]" || exit 0
          git push
