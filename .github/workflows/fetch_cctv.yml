- name: 1. 擷取最新 CCTV 影像
        run: |
          export TZ="Asia/Taipei"
          
          python3 - <<EOF
          from playwright.sync_api import sync_playwright
          import datetime, os, time, json

          cams = ["wra-000901", "wra-000779"]
          timestamp = datetime.datetime.now().strftime("%Y%m%d_%H%M")

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--autoplay-policy=no-user-gesture-required"]
              )
              context = browser.new_context(viewport={'width': 1920, 'height': 1080})
              page = context.new_page()
              
              for cam in cams:
                  os.makedirs(f"history/{cam}", exist_ok=True)
                  try:
                      page.goto(f"https://www.twipcam.com/cam/{cam}", timeout=60000)
                      time.sleep(3)
                      player = page.locator(f"video, img[src*='{cam}']").first
                      
                      if player.is_visible():
                          try: player.click(timeout=5000)
                          except: pass
                      
                      time.sleep(15)
                      
                      # 👑 殺手鐧：截圖前，強制刪除所有 Google 廣告、iframe 與彈出視窗
                      page.evaluate("""
                          document.querySelectorAll('ins, iframe, .adsbygoogle, [id^="google_ads"]').forEach(el => el.remove());
                      """)
                      
                      if player.is_visible():
                          player.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                      else:
                          page.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                          
                  except Exception as e:
                      print(f"CCTV 截圖失敗 {cam}: {e}")
                      
              browser.close()

          data = {}
          for c in cams:
              path = f"history/{c}"
              if os.path.exists(path):
                  files = sorted([f for f in os.listdir(path) if f.endswith(".jpg")])
                  data[c] = files
          with open("history/index.json", "w") as f:
              json.dump(data, f)
          EOF

          find history/ -type f -name "*.jpg" -mtime +3 -exec rm {} \;
