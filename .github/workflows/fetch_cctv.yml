name: Auto Backup CCTV Snapshot & Weather

on:
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Browser Automation (Playwright)
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium

      - name: 1. 擷取最新 CCTV 影像 (含廣告清除)
        run: |
          export TZ="Asia/Taipei"
          
          python3 - <<EOF
          from playwright.sync_api import sync_playwright
          import datetime, os, time, json

          cams = ["wra-000901", "wra-000779"]
          timestamp = datetime.datetime.now().strftime("%Y%m%d_%H%M")

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--autoplay-policy=no-user-gesture-required"]
              )
              context = browser.new_context(viewport={'width': 1920, 'height': 1080})
              page = context.new_page()
              
              for cam in cams:
                  os.makedirs(f"history/{cam}", exist_ok=True)
                  try:
                      page.goto(f"https://www.twipcam.com/cam/{cam}", timeout=60000)
                      time.sleep(3)
                      player = page.locator(f"video, img[src*='{cam}']").first
                      
                      if player.is_visible():
                          try: player.click(timeout=5000)
                          except: pass
                      
                      time.sleep(15)
                      
                      # 👑 殺手鐧：截圖前強制清除網頁上的 Google 廣告
                      page.evaluate("""
                          document.querySelectorAll('ins, iframe, .adsbygoogle, [id^="google_ads"]').forEach(el => el.remove());
                      """)
                      
                      if player.is_visible():
                          player.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                      else:
                          page.screenshot(path=f"history/{cam}/{timestamp}.jpg")
                          
                  except Exception as e:
                      print(f"CCTV 截圖失敗 {cam}: {e}")
                      
              browser.close()

          # 更新前端用的圖片索引
          data = {}
          for c in cams:
              path = f"history/{c}"
              if os.path.exists(path):
                  files = sorted([f for f in os.listdir(path) if f.endswith(".jpg")])
                  data[c] = files
          with open("history/index.json", "w") as f:
              json.dump(data, f)
          EOF

          # 自動清理超過 72 小時的舊圖片
          find history/ -type f -name "*.jpg" -mtime +3 -exec rm {} \;

      - name: 2. 擷取 CWA 氣象署 13 鄉鎮測站資料 (含去重防呆)
        run: |
          export TZ="Asia/Taipei"
          
          python3 - <<EOF
          import urllib.request
          import json
          import os
          import csv
          from datetime import datetime

          api_key = "CWA-BF25F9D4-B21F-43D8-8260-8F026866C42E"
          stations = {
              "C0TA40": "秀林鄉", "C0Z180": "新城鄉", "466990": "花蓮市",
              "C2TB30": "吉安鄉", "C1Z120": "壽豐鄉", "C0Z160": "鳳林鎮",
              "C0Z200": "萬榮鄉", "C0T960": "光復鄉", "C0Z210": "瑞穗鄉",
              "C0Z170": "卓溪鄉", "C0Z061": "玉里鎮", "C0T9N0": "富里鄉",
              "C0T9I0": "豐濱鄉"
          }
          
          station_ids = ",".join(stations.keys())
          endpoints = ['O-A0001-001', 'O-A0002-001', 'O-A0003-001']
          
          os.makedirs("weather_data", exist_ok=True)
          current_month = datetime.now().strftime("%Y-%m")
          csv_path = f"weather_data/hualien_weather_{current_month}.csv"
          file_exists = os.path.isfile(csv_path)
          
          # 👑 防呆升級：讀取現有資料，避免重複寫入同一時間點的紀錄
          existing_records = set()
          if file_exists:
              with open(csv_path, 'r', encoding='utf-8-sig') as f:
                  reader = csv.reader(f)
                  next(reader, None) # 跳過標題列
                  for row in reader:
                      if len(row) >= 2:
                          existing_records.add(f"{row[1]}_{row[0]}")
          
          with open(csv_path, 'a', newline='', encoding='utf-8-sig') as f:
              writer = csv.writer(f)
              if not file_exists:
                  writer.writerow(["觀測時間", "測站代碼", "鄉鎮名稱", "氣溫(°C)", "相對濕度(%)", "風速(m/s)", "時雨量(mm)", "日累積雨量(mm)"])
                  
              fetched_ids = set()
              for ep in endpoints:
                  url = f"https://opendata.cwa.gov.tw/api/v1/rest/datastore/{ep}?Authorization={api_key}&StationId={station_ids}"
                  try:
                      req = urllib.request.Request(url)
                      with urllib.request.urlopen(req) as response:
                          data = json.loads(response.read().decode('utf-8'))
                      records = data.get('records', {}).get('Station', [])
                      
                      for st in records:
                          st_id = st['StationId']
                          obs_time = st['ObsTime']['DateTime']
                          
                          # 檢查這筆時間的資料是不是已經存過了
                          if f"{st_id}_{obs_time}" in existing_records:
                              continue
                              
                          if st_id in fetched_ids: continue
                          fetched_ids.add(st_id)
                          
                          st_name = stations.get(st_id, st.get('StationName', ''))
                          we = st.get('WeatherElement', {})
                          
                          def get_val(val):
                              try:
                                  v = float(val)
                                  if v < -90: return ""
                                  return v
                              except:
                                  return ""
                          
                          temp = get_val(we.get('AirTemperature'))
                          hum = get_val(we.get('RelativeHumidity'))
                          wind = get_val(we.get('WindSpeed'))
                          
                          rain1hr = get_val(we.get('Past1hr', {}).get('Precipitation'))
                          if rain1hr == "":
                              rain1hr = get_val(we.get('Now', {}).get('Precipitation'))
                          rain24hr = get_val(we.get('Past24hr', {}).get('Precipitation'))
                          
                          writer.writerow([obs_time, st_id, st_name, temp, hum, wind, rain1hr, rain24hr])
                  except Exception as e:
                      pass
          EOF

      - name: 3. Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ weather_data/
          git commit -m "Auto backup CCTV & Weather [skip ci]" || exit 0
          git push
